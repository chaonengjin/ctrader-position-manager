<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄金市场智能仪表盘</title><style>
:root{--bg:#07111f;--p:#0d1a2b;--p2:#111f32;--l:#20334b;--t:#e8f0f8;--m:#8fa4bb;--g:#25d39b;--r:#ff647c;--y:#f5c85b;--b:#58a6ff;--o:#ff9d5c}*{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}body{overflow:auto}.app{max-width:1180px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand h1{font-size:20px;margin:0 0 3px}.brand p{margin:0;color:var(--m);font-size:11px}.status{border:1px solid var(--l);background:var(--p);padding:7px 10px;border-radius:9px;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--y);margin-right:6px}.connected .dot{background:var(--g)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.card{grid-column:span 6;background:linear-gradient(180deg,var(--p),#0a1727);border:1px solid var(--l);border-radius:12px;padding:12px}.wide{grid-column:span 12}.third{grid-column:span 4}.card h2{font-size:12px;letter-spacing:.7px;margin:0 0 10px;color:#b8c8da}.hero{display:grid;grid-template-columns:1fr 2fr;gap:12px}.regime{display:flex;flex-direction:column;justify-content:center;min-height:115px}.regime-name{font-size:27px;font-weight:800}.bull{color:var(--g)}.bear{color:var(--r)}.range{color:var(--y)}.squeeze{color:var(--b)}.score{font-size:12px;color:var(--m);margin-top:5px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:var(--p2);border-radius:8px;padding:9px}.metric b{display:block;font-size:17px;margin-top:4px}.label{font-size:10px;color:var(--m)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.06)}th{color:var(--m);font-weight:500}.pill{display:inline-block;padding:3px 7px;border-radius:20px;background:#16283e}.good{color:var(--g)}.bad{color:var(--r)}.kv{display:grid;grid-template-columns:1fr 1fr;gap:7px}.kv div{background:var(--p2);padding:8px;border-radius:8px}.kv strong{display:block;margin-top:3px}.bar{height:7px;background:#17273a;border-radius:20px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--b)}.news{padding:8px;border:1px solid var(--l);border-radius:8px}.news small,.empty{color:var(--m);font-size:11px}.debug{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;max-height:190px;overflow:auto;background:#050c15;border-radius:8px;padding:8px;white-space:pre-wrap}.foot{margin-top:10px;color:var(--m);font-size:9px;line-height:1.5}@media(max-width:800px){.card,.wide,.third{grid-column:span 12}.hero{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="root"></div><script type="module">
import{createClientAdapter}from"https://esm.sh/@spotware-web-team/sdk-external-api";import{handleConfirmEvent,registerEvent,getLightSymbolList,getSymbol,subscribeQuotes,quoteEvent,getAccountInformation,getTrendbarList,getDealList,executionEvent}from"https://esm.sh/@spotware-web-team/sdk";import{take,tap,catchError}from"https://esm.sh/rxjs";import{createLogger}from"https://esm.sh/@veksa/logger";
const TF={M5:5,M15:7,H1:9,H4:10,D1:12},S={connected:false,adapter:null,id:null,symbol:null,quote:null,account:null,bars:{},deals:[],logs:[]},$=x=>document.getElementById(x);function log(x){S.logs.push(new Date().toLocaleTimeString()+" "+(typeof x==="string"?x:JSON.stringify(x)));S.logs=S.logs.slice(-80);let e=$("debug");if(e){e.textContent=S.logs.join("\n");e.scrollTop=e.scrollHeight}}function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function fmt(n,d=2){return Number.isFinite(+n)?(+n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—"}function pr(n){return fmt(n,S.symbol?.digits??2)}function unwrap(x){return x?.payload??x?.result??x}function arr(x){for(const k of["symbols","symbol","lightSymbols","lightSymbol","trendbars","trendbar","bars","deals","deal"])if(Array.isArray(x?.[k]))return x[k];return[]}function pi(x){return +x/1e5}function bar(b){let l=pi(b.low);return{t:+b.utcTimestampInMinutes*60000,o:l+(+b.deltaOpen||0)/1e5,c:l+(+b.deltaClose||0)/1e5,h:l+(+b.deltaHigh||0)/1e5,v:+b.volume||0}}function sma(a,n){if(a.length<n)return null;let s=0;for(let i=a.length-n;i<a.length;i++)s+=a[i];return s/n}function ema(a,n){if(!a.length)return[];let k=2/(n+1),e=a[0],o=[e];for(let i=1;i<a.length;i++){e=a[i]*k+e*(1-k);o.push(e)}return o}function atr(b,n=14){if(b.length<n+1)return null;let t=[];for(let i=1;i<b.length;i++)t.push(Math.max(b[i].h-b[i].l,Math.abs(b[i].h-b[i-1].c),Math.abs(b[i].l-b[i-1].c)));return sma(t,n)}function bb(b,n=20){if(b.length<n)return null;let a=b.slice(-n).map(x=>x.c),m=sma(a,n),v=a.reduce((s,x)=>s+(x-m)**2,0)/n;return m?4*Math.sqrt(v)/m*100:null}function ana(b){if(!b||b.length<55)return{state:"数据不足"};let c=b.map(x=>x.c),e20=ema(c,20),e50=ema(c,50),l=c.at(-1),s20=e20.at(-1),s50=e50.at(-1),sl=s20-e20.at(-6),a=atr(b),hi=Math.max(...b.slice(-20).map(x=>x.h)),lo=Math.min(...b.slice(-20).map(x=>x.l)),score=50+(l>s20?12:-12)+(s20>s50?15:-15)+(sl>0?10:-10)+(l>hi-(a||0)*.25?8:0)-(l<lo+(a||0)*.25?8:0);score=Math.max(0,Math.min(100,score));return{state:score>=70?"多头":score<=30?"空头":"震荡",score,ema20:s20,ema50:s50,atr:a,bb:bb(b),high:hi,low:lo}}function overall(){let a=Object.values(S.bars).map(ana).filter(x=>x.score!=null);if(!a.length)return{regime:"数据不足"};let sc=a.reduce((s,x)=>s+x.score,0)/a.length,b=S.bars.M15?ana(S.bars.M15):{};return{regime:b.bb!=null&&b.bb<.25?"挤压":sc>=72?"多头趋势":sc<=28?"空头趋势":"震荡",score:sc,atr:b.atr,bb:b.bb}}function session(){let h=new Date().getUTCHours()+new Date().getUTCMinutes()/60;return{n:h>=7&&h<13?"伦敦":h>=13&&h<22?"纽约":h>=22||h<1?"纽约尾盘":"亚洲",h}}function render(){let o=overall(),m=ana(S.bars.M15),q=S.quote,ss=session();$("root").innerHTML=`<div class="app"><div class="top"><div class="brand"><h1>黄金市场智能仪表盘</h1><p>XAUUSD · 多周期市场状态 · 结构 · 波动率 · Session · 新闻 · 交易复盘</p></div><div id="status" class="status ${S.connected?"connected":""}"><span class="dot"></span>${S.connected?"已连接":"正在连接"}</div></div><div class="grid"><section class="card wide hero"><div class="regime"><span class="label">当前市场状态</span><div class="regime-name ${o.regime.includes("多")?"bull":o.regime.includes("空")?"bear":o.regime.includes("挤")?"squeeze":"range"}">${o.regime}</div><div class="score">市场一致度：${o.score==null?"—":fmt(o.score,0)+" / 100"}</div></div><div class="metrics"><div class="metric"><span class="label">现价</span><b>${q?pr((q.bid+q.ask)/2):"—"}</b></div><div class="metric"><span class="label">买价</span><b>${q?pr(q.ask):"—"}</b></div><div class="metric"><span class="label">卖价</span><b>${q?pr(q.bid):"—"}</b></div><div class="metric"><span class="label">点差</span><b>${q?pr(q.ask-q.bid):"—"}</b></div></div></section><section class="card wide"><h2>多周期市场状态</h2><table><tr><th>周期</th><th>状态</th><th>一致度</th><th>EMA20</th><th>EMA50</th><th>ATR</th></tr>${["M5","M15","H1","H4","D1"].map(k=>{let x=ana(S.bars[k]);return`<tr><td>${k}</td><td class="${x.state==="多头"?"good":x.state==="空头"?"bad":""}">${x.state}</td><td>${x.score==null?"—":fmt(x.score,0)}</td><td>${x.ema20?pr(x.ema20):"—"}</td><td>${x.ema50?pr(x.ema50):"—"}</td><td>${x.atr?pr(x.atr):"—"}</td></tr>`}).join("")}</table></section><section class="card third"><h2>交易时段</h2><div class="regime"><div class="regime-name">${ss.n}</div><div class="score">UTC ${String(Math.floor(ss.h)).padStart(2,"0")}:${String(Math.floor(ss.h%1*60)).padStart(2,"0")}</div></div></section><section class="card third"><h2>波动率</h2><div class="kv"><div><span class="label">ATR</span><strong>${o.atr?pr(o.atr):"—"}</strong></div><div><span class="label">BB宽度</span><strong>${o.bb?fmt(o.bb,2)+"%":"—"}</strong></div></div><div class="bar"><i style="width:${Math.min(100,(o.bb||0)*3)}%"></i></div></section><section class="card third"><h2>结构</h2><div class="kv"><div><span class="label">M15 20周期高点</span><strong>${m.high?pr(m.high):"—"}</strong></div><div><span class="label">M15 20周期低点</span><strong>${m.low?pr(m.low):"—"}</strong></div></div><div class="empty">第一版结构采用高低点 + 趋势确认；严格 BOS/CHOCH 可在 V1.1 加入。</div></section><section class="card wide"><h2>新闻 / 宏观</h2><div class="news"><strong>新闻数据源状态</strong><br><small>cTrader Plugin SDK 当前不直接提供经济日历接口。本版本不虚构实时新闻；该区域预留合规外部数据源。</small></div></section><section class="card wide"><h2>交易复盘</h2>${S.deals.length?`<table><tr><th>时间</th><th>品种</th><th>方向</th><th>成交价</th><th>结果</th></tr>${S.deals.slice(-10).reverse().map(d=>`<tr><td>${new Date(d.t).toLocaleString()}</td><td>${esc(d.name)}</td><td>${d.side===1?"做多":"做空"}</td><td>${d.p?pr(d.p):"—"}</td><td>${d.profit==null?"成交记录":fmt(d.profit,2)}</td></tr>`).join("")}</table>`:`<div class="empty">连接后监听交易执行事件；历史交易统计将在下一阶段扩展。</div>`}</section><section class="card wide"><h2>SDK 调试</h2><div id="debug" class="debug">${esc(S.logs.join("\n"))}</div></section></div><div class="foot">市场状态是规则型分析，不代表价格预测或盈利保证。SDK 连接层严格采用 cTrader 官方当前 Web Plugin 握手流程。</div></div>`}function call(o,label){return new Promise((res,rej)=>o.pipe(take(1),tap(x=>{log(label+" ✓");res(x)}),catchError(e=>{log(label+" ✕ "+(e?.message||JSON.stringify(e)));rej(e);return[]})).subscribe())}
async function init(){let r=await call(getLightSymbolList(S.adapter,{}),"读取品种列表"),a=arr(unwrap(r)),x=a.find(s=>/XAU|GOLD/i.test(s.name||""))||a.find(s=>/XAU|GOLD/i.test(s.description||""));if(!x)throw Error("找不到 XAUUSD/GOLD 品种");S.id=+(x.id??x.symbolId);log("黄金品种："+(x.name||"XAUUSD")+" ID="+S.id);let sr=await call(getSymbol(S.adapter,{symbolId:[S.id]}),"读取黄金参数"),sp=unwrap(sr);S.symbol=arr(sp)[0]||sp.symbol||sp;await call(subscribeQuotes(S.adapter,{symbolId:[S.id],subscribeToSpotTimestamp:true}),"订阅黄金行情");let now=Date.now();for(let k of Object.keys(TF)){let days=k==="D1"?260:k==="H4"?180:60,r=await call(getTrendbarList(S.adapter,{symbolId:S.id,period:TF[k],fromTimestamp:now-days*864e5,toTimestamp:now,count:300,type:0}),"读取 "+k+" K线");S.bars[k]=arr(unwrap(r)).map(bar).sort((a,b)=>a.t-b.t).slice(-300);log(k+" K线="+S.bars[k].length)}let ac=await call(getAccountInformation(S.adapter,{}),"读取账户");S.account=unwrap(ac);let dl=await call(getDealList(S.adapter,{fromTimestamp:now-30*864e5,toTimestamp:now}),"读取近30日成交");S.deals=arr(unwrap(dl)).map(d=>({t:+d.executionTimestamp,name:d.symbolName||"XAUUSD",side:d.tradeSide,p:d.executionPrice,profit:d.closePositionDetail?Number(d.closePositionDetail.profit)/10**Number(d.closePositionDetail.moneyDigits||2):null}));render()}function connect(){log("① 页面已加载");try{S.adapter=createClientAdapter({logger:createLogger(location.href.includes("showLogs"))});log("② Adapter 已创建");handleConfirmEvent(S.adapter,{}).pipe(take(1)).subscribe(()=>log("③ 第一次 Confirm 已发送"));registerEvent(S.adapter).pipe(take(1),tap(()=>{log("④ Host Register 已收到");handleConfirmEvent(S.adapter,{}).pipe(take(1)).subscribe(()=>log("⑤ 第二次 Confirm 已发送"));S.connected=true;log("⑥ SDK 已连接");render();startStreams();init().catch(e=>{log("数据初始化失败："+(e?.message||e));render()})}),catchError(e=>{log("SDK连接失败："+(e?.message||e));return[]})).subscribe()}catch(e){log("初始化异常："+e.message)}}
quoteEvent(S.adapter??{});render();connect();
// quote stream is attached only after connection; the official SDK emits ProtoQuoteEvent objects.
setTimeout(()=>{if(S.adapter)quoteEvent(S.adapter).pipe(tap(e=>{if(+e.symbolId===S.id){let bid=e.bid?pi(e.bid):null,ask=e.ask?pi(e.ask):null;if(bid&&ask){S.quote={bid,ask};render()}}})).subscribe()},1500);
executionEvent(S.adapter??{}).pipe(catchError(()=>[])).subscribe(e=>{if(e){log("交易执行事件");render()}});setInterval(render,5000);
</script></body></html>
