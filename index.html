<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Position Manager</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">cTrader</div>
        <h1>Position Manager</h1>
      </div>
      <div class="connection">
        <span id="connectionDot" class="status-dot offline"></span>
        <span id="connectionText">Connecting…</span>
      </div>
    </header>

    <section class="account-grid">
      <article class="metric-card">
        <span class="metric-label">Balance</span>
        <strong id="balance">—</strong>
      </article>
      <article class="metric-card">
        <span class="metric-label">Equity</span>
        <strong id="equity">—</strong>
      </article>
      <article class="metric-card">
        <span class="metric-label">Used Margin</span>
        <strong id="usedMargin">—</strong>
      </article>
      <article class="metric-card">
        <span class="metric-label">Free Margin</span>
        <strong id="freeMargin">—</strong>
      </article>
    </section>

    <section class="section">
      <div class="section-title-row">
        <div>
          <h2>Positions</h2>
          <span id="positionCount" class="muted">0 open</span>
        </div>
        <button id="refreshButton" class="button secondary" type="button">Refresh</button>
      </div>
      <div id="positions" class="positions"></div>
    </section>

    <section id="notice" class="notice">
      <strong>Waiting for cTrader</strong>
      <span>This panel uses the cTrader Web Plugin SDK. Open it inside cTrader to connect.</span>
    </section>

    <footer class="footer">
      <span>Position Manager V1</span>
      <span id="placement"></span>
    </footer>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
